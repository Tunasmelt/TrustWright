[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustwright-mcp"
version = "0.4.3"
description = "Evidence-scoped authentication assessment over local MCP"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp==1.30.0", "jsonschema>=4.23,<5", "PyYAML>=6.0.2,<7", "rfc3339-validator>=0.1.4,<1", "packaging>=24,<27"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "fastapi==0.142.2", "PyJWT==2.15.1", "pwdlib==0.3.0", "httpx>=0.28,<1", "build>=1,<2", "ruff>=0.9,<1"]

[project.scripts]
trustwright = "trustwright.cli:main"

[tool.setuptools]
packages = ["trustwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
